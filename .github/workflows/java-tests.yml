name: Java Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Compile application and tests
        run: javac -d build UC1/src/*.java UC1/test/*.java
      - name: Run booking workflow tests
        run: java -cp build BookingWorkflowTest
      - name: Run booking persistence tests
        run: java -cp build BookingFileStoreTest
